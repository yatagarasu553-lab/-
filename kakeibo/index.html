<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff2f4"><title>ぽけっと家計簿 ♡</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#484451;background:#fff8f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#fff3f5,#f8f6ff 58%,#f1fbf8)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9f7cff;outline-offset:2px}.wrap{max-width:540px;padding:20px 17px 92px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 1px 20px}.eyebrow{color:#a18f9a;font-weight:700;font-size:12px;letter-spacing:.1em}.title{font-weight:900;font-size:28px;letter-spacing:.03em;margin:4px 0 0}.mascot{height:64px;width:64px;display:grid;place-items:center;border-radius:22px;background:#ffe2ea;box-shadow:0 8px 20px #f7c1d05e;font-size:33px;transform:rotate(5deg)}.card{background:#ffffffec;border:1px solid #fff;box-shadow:0 10px 26px #a88b9914;border-radius:26px;padding:20px;margin-bottom:16px}.month{display:flex;align-items:center;justify-content:center;gap:19px;margin-bottom:12px}.month strong{font-size:17px}.iconbtn{border:0;background:#f8f2f6;border-radius:12px;width:36px;height:36px;font-size:23px;color:#8b7986}.summary{background:linear-gradient(125deg,#ffb8c8,#fcbaca 50%,#e8b7ff);color:#654855;border:0;overflow:hidden;position:relative}.summary:after{content:'✿';position:absolute;color:#ffffff65;right:-6px;top:11px;font-size:104px}.summary .label{font-size:13px;font-weight:800}.total{font-size:39px;font-weight:900;letter-spacing:-.025em;margin:9px 0}.total small{font-size:20px;margin-right:3px}.sub{font-size:12px;color:#745a67}.section{font-weight:900;font-size:17px;margin:4px 0 15px}.segments{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.segment{border-radius:19px;padding:15px 8px;text-align:center}.segment .emoji{font-size:25px}.segment .cat{font-size:12px;font-weight:800;margin:7px 0}.segment .val{font-size:15px;font-weight:900;white-space:nowrap}.gas{background:#fff0df}.food{background:#e9f9ed}.fun{background:#f0e9ff}.bar{height:14px;border-radius:20px;background:#f5f0f3;display:flex;overflow:hidden;margin-top:16px}.bar div{transition:width .2s}.muted{color:#9b939a;font-size:12px;line-height:1.6}.formgrid{display:grid;gap:14px}.field{display:grid;gap:7px}.field label{font-size:13px;font-weight:800}.field input,.field select{width:100%;height:48px;padding:0 14px;border:1.5px solid #efe6ec;border-radius:14px;background:#fff;color:#524a56;font-size:16px}.field input:focus,.field select:focus{border-color:#f6a1b7;outline:0}.catpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.catpick input{position:absolute;opacity:0;width:1px;height:1px}.catpick label{display:block;text-align:center;border:2px solid transparent;border-radius:16px;padding:12px 4px;background:#faf6f7;font-size:12px;font-weight:800;cursor:pointer}.catpick label span{display:block;font-size:26px;margin-bottom:4px}.catpick input:checked+label{border-color:#fb92ae;background:#fff1f5}.catpick input:focus-visible+label{outline:3px solid #a077e9;outline-offset:2px}.save{border:0;background:#f78eaa;color:white;border-radius:16px;padding:15px;font-weight:900;width:100%;font-size:16px;box-shadow:0 6px 12px #f78eaa3e}.save:active{transform:translateY(1px)}.row{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #f5eef0}.row:last-child{border-bottom:0}.round{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:21px;flex-shrink:0}.info{flex:1;min-width:0}.info strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{color:#a39aa2;font-size:12px}.amount{font-weight:900;font-size:15px;white-space:nowrap}.del{border:0;background:#fbf2f3;border-radius:10px;color:#a28b92;width:30px;height:30px;font-size:17px}.bottom{display:flex;gap:8px;flex-wrap:wrap}.softbtn{border:1px solid #ebdfe8;background:#fff;border-radius:13px;padding:10px 13px;color:#806f7c;font-weight:750;font-size:12px}.empty{text-align:center;padding:22px 4px;color:#9c939c;font-size:13px}.empty span{display:block;font-size:35px;margin-bottom:7px}.toast{display:none;position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#544b58;color:white;border-radius:20px;padding:10px 20px;box-shadow:0 8px 24px #0002;font-size:13px;z-index:3;white-space:nowrap}.footer{text-align:center;color:#a99da9;font-size:12px;margin:22px 0}.help{margin-top:13px}input[type=file]{display:none}@media(max-width:370px){.segment .val{font-size:13px}.wrap{padding-left:12px;padding-right:12px}.card{padding:15px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">MY LITTLE MONEY DIARY</div><h1 class="title">ぽけっと家計簿 ♡</h1></div><div class="mascot" aria-hidden="true">🐰</div></header>
<section class="card summary" aria-label="月間合計"><div class="month"><button class="iconbtn" id="prev" aria-label="前の月">‹</button><strong id="month"></strong><button class="iconbtn" id="next" aria-label="次の月">›</button></div><div class="label">今月の支出</div><div class="total"><small>¥</small><span id="total">0</span></div><div class="sub" id="count">0件の記録 ♡</div></section>
<section class="card"><h2 class="section">何に使ったかな？ 🍬</h2><div class="segments"><div class="segment gas"><div class="emoji">⛽</div><div class="cat">ガソリン代</div><div class="val" id="gas">¥0</div></div><div class="segment food"><div class="emoji">🍙</div><div class="cat">ご飯代</div><div class="val" id="food">¥0</div></div><div class="segment fun"><div class="emoji">🎮</div><div class="cat">娯楽費</div><div class="val" id="fun">¥0</div></div></div><div class="bar" id="bar" aria-label="カテゴリー別支出割合"></div><p class="muted" style="margin-bottom:0">色の長さで支出の割合が分かるよ ✨</p></section>
<section class="card" id="formarea"><h2 class="section" id="formtitle">＋ 支出を記録する 🌷</h2><form id="form" class="formgrid"><div class="field"><label>カテゴリー</label><div class="catpick"><div><input type="radio" name="category" value="gas" id="cgas"><label for="cgas"><span>⛽</span>ガソリン</label></div><div><input type="radio" name="category" value="food" id="cfood" checked><label for="cfood"><span>🍙</span>ご飯</label></div><div><input type="radio" name="category" value="fun" id="cfun"><label for="cfun"><span>🎮</span>娯楽</label></div></div></div><div class="field"><label for="amount">金額（円）</label><input id="amount" inputmode="numeric" type="number" min="1" max="999999999" step="1" placeholder="例：1200" required></div><div class="field"><label for="date">日付</label><input id="date" type="date" required></div><div class="field"><label for="memo">メモ（任意）</label><input id="memo" type="text" maxlength="80" placeholder="例：ランチ、給油など"></div><button class="save" type="submit" id="savebtn">記録する ♡</button><button class="softbtn" type="button" id="cancel" style="display:none">編集をやめる</button></form></section>
<section class="card"><h2 class="section">使った履歴 📖</h2><div id="history"></div></section>
<section class="card"><h2 class="section">データの保存 🎀</h2><div class="bottom"><button class="softbtn" id="export" type="button">⬇ バックアップを保存</button><button class="softbtn" id="import" type="button">⬆ データを復元</button><input id="file" type="file" accept=".json,application/json"></div><p class="muted help">入力内容はこのブラウザ内に保存されます。ブラウザのデータ削除・端末変更に備えて、ときどきバックアップを保存してね。</p></section><div class="footer">つかったお金も、やさしく見える化 ♡</div></main><div class="toast" role="status" id="toast"></div>
<script>
(()=>{'use strict';const KEY='pocket-kakeibo-v1',CAT={gas:{name:'ガソリン代',emoji:'⛽',color:'#ffc17b',bg:'gas'},food:{name:'ご飯代',emoji:'🍙',color:'#99dfb0',bg:'food'},fun:{name:'娯楽費',emoji:'🎮',color:'#c3a8f5',bg:'fun'}};const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('ja-JP'),localToday=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};let records=[],editing=null;const now=new Date();let year=now.getFullYear(),month=now.getMonth()+1;
function validate(arr){if(!Array.isArray(arr))throw Error('形式が違います');return arr.map(r=>{if(!r||!CAT[r.category]||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(r.date)||!Number.isSafeInteger(r.amount)||r.amount<1||r.amount>999999999||typeof r.id!=='string'||typeof r.memo!=='string')throw Error('データに不正な項目があります');const d=new Date(r.date+'T12:00:00');if(isNaN(d.getTime())||d.toISOString().slice(0,10)!==r.date)throw Error('日付が不正です');return {id:r.id.slice(0,100),category:r.category,date:r.date,amount:r.amount,memo:r.memo.slice(0,80)}})}
try{records=validate(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){records=[];alert('保存済みデータを読み込めませんでした。既存のデータは変更していません。')}const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){alert('このブラウザに保存できません。ストレージ設定を確認してください。');return false}};let toastTimer;function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2300)}function shift(n){month+=n;if(month<1){month=12;year--}if(month>12){month=1;year++}render()}function reset(){editing=null;$('form').reset();$('cfood').checked=true;$('date').value=localToday();$('formtitle').textContent='＋ 支出を記録する 🌷';$('savebtn').textContent='記録する ♡';$('cancel').style.display='none'}function edit(r){editing=r.id;$('amount').value=r.amount;$('date').value=r.date;$('memo').value=r.memo;$('c'+r.category).checked=true;$('formtitle').textContent='✎ 記録を編集する';$('savebtn').textContent='変更を保存 ♡';$('cancel').style.display='block';$('formarea').scrollIntoView({behavior:'smooth',block:'start'})}
function render(){const m=String(month).padStart(2,'0'),prefix=year+'-'+m;const rs=records.filter(r=>r.date.startsWith(prefix)).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));const sum={gas:0,food:0,fun:0};rs.forEach(r=>sum[r.category]+=r.amount);const total=sum.gas+sum.food+sum.fun;$('month').textContent=year+'年 '+month+'月';$('total').textContent=fmt(total);$('count').textContent=rs.length+'件の記録 ♡';Object.keys(CAT).forEach(k=>$(k).textContent='¥'+fmt(sum[k]));$('bar').replaceChildren();Object.keys(CAT).forEach(k=>{const el=document.createElement('div');el.style.background=CAT[k].color;el.style.width=(total?100*sum[k]/total:0)+'%';$('bar').append(el)});const history=$('history');history.replaceChildren();if(!rs.length){history.innerHTML='<div class="empty"><span>🧸</span>まだ記録がないよ。<br>使ったお金を記録してみよう ♡</div>';return}rs.forEach(r=>{const row=document.createElement('div');row.className='row';const badge=document.createElement('div');badge.className='round '+CAT[r.category].bg;badge.textContent=CAT[r.category].emoji;const info=document.createElement('div');info.className='info';const name=document.createElement('strong');name.textContent=r.memo||CAT[r.category].name;const sub=document.createElement('small');sub.textContent=r.date.slice(5).replace('-','/')+' · '+CAT[r.category].name;info.append(name,sub);info.style.cursor='pointer';info.title='タップして編集';info.addEventListener('click',()=>edit(r));const amt=document.createElement('div');amt.className='amount';amt.textContent='¥'+fmt(r.amount);amt.style.cursor='pointer';amt.addEventListener('click',()=>edit(r));const del=document.createElement('button');del.className='del';del.textContent='×';del.setAttribute('aria-label','この記録を削除');del.addEventListener('click',()=>{if(confirm('この記録を削除しますか？')){const old=records;records=records.filter(x=>x.id!==r.id);if(!persist())records=old;else{if(editing===r.id)reset();render();toast('削除しました')}}});row.append(badge,info,amt,del);history.append(row)})}
$('prev').addEventListener('click',()=>shift(-1));$('next').addEventListener('click',()=>shift(1));$('cancel').addEventListener('click',reset);$('form').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('amount').value),date=$('date').value,category=document.querySelector('input[name="category"]:checked')?.value,memo=$('memo').value.trim();if(!Number.isSafeInteger(amount)||amount<1||amount>999999999||!CAT[category]||!date){toast('入力内容を確認してね');return}const parsed=new Date(date+'T12:00:00');if(isNaN(parsed.getTime())||parsed.toISOString().slice(0,10)!==date){toast('日付を確認してね');return}const obj={id:editing||(crypto.randomUUID?.()||String(Date.now())+'-'+Math.random()),category,amount,date,memo};const old=records;records=editing?records.map(r=>r.id===editing?obj:r):[...records,obj];if(!persist()){records=old;return}const wasEditing=!!editing;year=Number(date.slice(0,4));month=Number(date.slice(5,7));reset();render();toast(wasEditing?'変更しました ♡':'記録したよ ♡')});$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='家計簿バックアップ_'+localToday()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('バックアップを作成しました')});$('import').addEventListener('click',()=>$('file').click());$('file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>5e6)throw Error('ファイルが大きすぎます');const data=validate(JSON.parse(await file.text()));if(!confirm('現在の記録をバックアップの内容に置き換えますか？'))return;const old=records;records=data;if(!persist()){records=old;return}reset();render();toast('復元できました ♡')}catch(err){alert('読み込みに失敗しました：'+err.message)}});reset();render()})();
</script></body></html>
